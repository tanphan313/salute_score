# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Mirrors podfoods_api's dev/test DB env vars so both repos point at the same
# local/shared Postgres the same way. Unset envs fall back to Rails' own
# default (local domain socket, peer-auth role matching the OS user).

dev_default: &dev_default
  host: <%= ENV["SALUTE_SCORE_DATABASE_HOST"] %>
  username: <%= ENV["SALUTE_SCORE_DATABASE_USER"] %>
  password: <%= ENV["SALUTE_SCORE_DATABASE_PASS"] %>

development:
  <<: *default
  <<: *dev_default
  database: salute_score_api_development
